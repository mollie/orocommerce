# Fails when an Oro ACL/CSRF attribute is written inside a docblock, where PHP never reads it.
name: "ACL attributes"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions: {}

jobs:
  check:
    name: Check ACL/CSRF attributes outside docblocks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Find attributes inside docblocks
        run: |
          if grep -rnE --include='*.php' --exclude-dir=IntegrationCore --exclude-dir=Tests --exclude-dir=.git \
            '^\s*(/\*\*|\*).*#\[(Acl|AclAncestor|CsrfProtection)\b' .; then
            echo "::error::#[Acl], #[AclAncestor] and #[CsrfProtection] must be real attributes, not docblock text."
            exit 1
          fi
